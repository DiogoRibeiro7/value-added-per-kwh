# Configuration for value-added-per-kwh. Every number below that is an assumption says so, and
# every sourced number names its source.

paths:
  raw: data/raw
  tables: outputs/tables
  figures: outputs/figures

# --- Across countries ------------------------------------------------------------------------
countries:
  owid:
    # Our World in Data energy dataset, pinned to one commit so the figures can be reproduced.
    url: "https://raw.githubusercontent.com/owid/energy-data/f8de88a4f6f9cab44f1cf606047cbd6c4414042c/owid-energy-data.csv"
    sha256: "266f2e2baad7975351bc9bb4aa061d22b1da9fe4c47d51d2ac6071e01e171f76"
  year: 2022                 # latest year with GDP (Maddison Project) in the dataset
  min_population: 250000     # drops microstates, keeps Iceland
  income_thresholds: [20000, 25000, 30000, 40000]   # GDP per person, 2011 international dollars
  aluminium:
