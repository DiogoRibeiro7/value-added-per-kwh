    # Institute's 2022 average outside China, 15,008 kWh/t (as quoted in an IAI-hosted report;
    # China 13,448). Overstates China's share, which stays below the 10% marked in the figure.
    mwh_per_tonne: 15.0
    # Primary aluminium output, 2022, thousand tonnes. British Geological Survey, World Mineral
    # Production 2018-2022 (2024), table 'Production of primary aluminium'; India from USGS
    # Mineral Commodity Summaries 2024 (the BGS 2022 India figure looks incomplete). Spain
    # produced none in 2022 (San Ciprian shut down; USGS). Values marked * are BGS estimates.
