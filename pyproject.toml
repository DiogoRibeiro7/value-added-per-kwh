[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kwh-value"
version = "0.1.0"
description = "Value added per kWh of electricity: across countries, by sector in Portugal and Spain, and for specific uses."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
keywords = ["electricity", "value added", "national accounts", "energy balance", "Eurostat", "Portugal", "Spain", "data centres"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kwh-value = "kwh_value.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kwh_value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
